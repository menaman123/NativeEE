; Default host input bindings (baked into the binary at configure time; a
; bindings file at Config's input.bindings_path replaces this whole table
; when every line of it parses -- one malformed line rejects the file).
;
; Grammar: [sticks] / [buttons] / [gamepad] / [pad] sections of key = value;
; ';' or '#' starts a comment; key names are case-insensitive; values are
; SDL key names (plus LShift/RShift/LCtrl/RCtrl/LAlt/RAlt) or Mouse1..3;
; under [pad] they are SDL game-controller control names.
[sticks]
mouse          = right      ; mouse deltas -> right stick (camera)
key_left_up    = W          ; digital keys -> left stick (movement)
key_left_down  = S
key_left_left  = A
key_left_right = D
mouse_sensitivity = 0.35    ; stick units per 100 px
mouse_decay       = 12.0    ; per-second exponential decay rate

[buttons]
cross    = Space
square   = LShift
circle   = Mouse2           ; right mouse button
triangle = E
l1       = 1
l2       = 2
r1       = 3
r2       = 4
l3       = 5
r3       = 6
start    = Y
select   = Tab
up       = Up               ; dpad = the arrow keys: menus navigable from the keyboard
down     = Down
left     = Left
right    = Right

[gamepad]
enabled  = 1                ; SDL_GameController's logical layout equals the
                            ; DualShock 2 layout (the [pad] default below).
                            ; deadzone applies to sticks.
deadzone = 0.15
sensitivity = 1.33          ; per-axis scale-and-clamp: lets circle-gated
                            ; pads reach the DualShock 2 gate's rail/corner
                            ; values; 1.0 = raw circular gate.

[pad]
; The gamepad-button remap (the launcher's Controls page writes this section
; by press-to-bind). <ps2 button> = <SDL control>: a b x y back guide start
; leftstick rightstick leftshoulder rightshoulder dpup dpdown dpleft dpright
; misc1 paddle1..4 touchpad lefttrigger righttrigger, or none. Omitted rows
; keep SDL's standard layout, which is the DualShock 2 layout:
cross    = a
circle   = b
square   = x
triangle = y
select   = back
start    = start
l3       = leftstick
r3       = rightstick
l1       = leftshoulder
r1       = rightshoulder
l2       = lefttrigger
r2       = righttrigger
up       = dpup
down     = dpdown
left     = dpleft
right    = dpright
